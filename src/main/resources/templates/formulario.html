<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión Académica - Formulario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        header { background: #1f3a5f; color: #fff; padding: 16px 32px; }
        main { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        form { background: #fff; padding: 24px; border-radius: 6px; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
        input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #bbb; border-radius: 4px; }
        .campoError { color: #b02a37; font-size: 13px; margin-top: 4px; display: block; }
        .botones { margin-top: 20px; display: flex; gap: 10px; }
        .boton { padding: 9px 16px; border: none; border-radius: 4px; background: #1f3a5f; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
        .boton.secundario { background: #6c757d; }
        .alerta { padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<header>
    <h1 th:text="${titulo}">Registrar estudiante</h1>
</header>
<main>
    <div th:if="${mensajeError}" class="alerta" th:text="${mensajeError}"></div>

    <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <label for="codigo">Código</label>
        <input type="text" id="codigo" th:field="*{codigo}">
        <span class="campoError" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>

        <label for="nombres">Nombres</label>
        <input type="text" id="nombres" th:field="*{nombres}">
        <span class="campoError" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></span>

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" th:field="*{apellidos}">
        <span class="campoError" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>

        <label for="correo">Correo</label>
        <input type="email" id="correo" th:field="*{correo}">
        <span class="campoError" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>

        <label for="carrera">Carrera</label>
        <input type="text" id="carrera" th:field="*{carrera}">
        <span class="campoError" th:if="${#fields.hasErrors('carrera')}" th:errors="*{carrera}"></span>

        <label for="semestre">Semestre</label>
        <input type="number" id="semestre" th:field="*{semestre}">
        <span class="campoError" th:if="${#fields.hasErrors('semestre')}" th:errors="*{semestre}"></span>

        <div class="botones">
            <button type="submit" class="boton">Guardar</button>
            <a th:href="@{/estudiantes}" class="boton secundario">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
